<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ระบบจัดการหมู่บ้านศรีไทย</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #0f172a; }
  #loading {
    position: fixed; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 16px;
    font-family: -apple-system, "Segoe UI", "Noto Sans Thai", sans-serif;
    color: #e2e8f0; background: #0f172a; z-index: 2;
  }
  .spinner {
    width: 40px; height: 40px; border-radius: 50%;
    border: 4px solid #334155; border-top-color: #60a5fa;
    animation: spin 0.9s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  #fallback { display: none; }
  #fallback a {
    color: #60a5fa; text-decoration: none; font-weight: 600;
  }
  iframe {
    position: fixed; inset: 0; width: 100%; height: 100%;
    border: 0; z-index: 1; background: #fff;
  }
</style>
</head>
<body>
  <div id="loading">
    <div class="spinner"></div>
    <div>กำลังโหลดระบบจัดการหมู่บ้านศรีไทย...</div>
    <div id="fallback">
      โหลดไม่สำเร็จ?
      <a id="open-link" href="#" target="_blank" rel="noopener">เปิดในแท็บใหม่</a>
    </div>
  </div>
  <iframe id="app-frame" title="ระบบจัดการหมู่บ้านศรีไทย" referrerpolicy="no-referrer"></iframe>

  <script>
    var APP_URL = "https://script.google.com/macros/s/AKfycbysRkLswIkdqEV4-ANQC7VT3sWKul8bMxdMUnqwjzRqMYBFRoluRWRT0ICW4SPyj7lYkg/exec";
    var APP_ORIGIN_PREFIX = "https://script.google.com/macros/s/";

    var frame = document.getElementById("app-frame");
    var loading = document.getElementById("loading");
    var fallback = document.getElementById("fallback");
    document.getElementById("open-link").href = APP_URL;
    var fallbackTimer;

    function showLoading() {
      fallback.style.display = "none";
      loading.style.display = "flex";
      clearTimeout(fallbackTimer);
      fallbackTimer = setTimeout(function () {
        fallback.style.display = "block";
      }, 6000);
    }

    frame.addEventListener("load", function () {
      loading.style.display = "none";
      clearTimeout(fallbackTimer);
    });

    // The app's own nav links use target="_top" (needed when Google embeds
    // it in its own sandbox iframe). Followed normally, that would navigate
    // this whole wrapper tab away to the bare .../exec URL. The app instead
    // posts the intended link to us (see Nav.html); we just swap the iframe
    // src, so the wrapper chrome/URL stays put while the page changes.
    window.addEventListener("message", function (event) {
      var data = event.data;
      if (!data || data.type !== "stv-navigate" || typeof data.href !== "string") return;
      if (data.href.indexOf(APP_ORIGIN_PREFIX) !== 0) return;
      showLoading();
      frame.src = data.href;
    });

    showLoading();
    frame.src = APP_URL;
  </script>
</body>
</html>
